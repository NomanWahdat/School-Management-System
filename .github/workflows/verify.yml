name: Verify school workflows and PostgreSQL isolation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: test_school_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r backend/requirements.txt
      - run: .venv/bin/python -B scripts/test_backend.py
      - run: .venv/bin/python -B scripts/verify_postgres.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:isolated-ci-password@127.0.0.1:5432/test_school_ci
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
